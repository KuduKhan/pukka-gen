name: Pukka Gen Browser, Accessibility & Visual QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-acceptance:
    name: Three engines / six viewports / accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install production dependencies
        run: npm ci
      - name: Install isolated browser-only QA tooling
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start Vite server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pukka-vite.log 2>&1 &
      - name: Check responsive layouts, interactions, console and WCAG AA
        env:
          PUKKA_BASE_URL: http://127.0.0.1:4173/
        run: node scripts/browser-qa.mjs
      - name: Upload visual snapshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pukka-v2.3-visual-qa
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/pukka-vite.log
