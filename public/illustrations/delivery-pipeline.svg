  <linearGradient id="glow" x1="0" y1="0" x2="1"><stop stop-color="#A9F9E6"/><stop offset="1" stop-color="#72B6F5"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#91E7DA" stroke-opacity=".075" fill="none"/></pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
