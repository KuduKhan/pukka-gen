<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Pukka Gen delivery pipeline concept</title><desc id="desc">An original visual showing discovery, design, engineering, verification and deployment as five connected stages.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B263A"/><stop offset="1" stop-color="#163F4D"/></linearGradient>
